name: Daily LinkedIn Job Collector

on:
  schedule:
    # 03:30 UTC = 9:00 AM IST every morning
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows clicking "Run workflow" button anytime from GitHub UI

jobs:
  collect-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push updated CSV and history back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Collector (40 India + 10 Big Tech)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: |
          python main.py --india-limit 40 --intl-limit 10

      - name: Upload Daily CSV as GitHub Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-linkedin-jobs
          path: linkedin_jobs_*.csv
          retention-days: 30

      - name: Commit and Push Daily CSV & History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A linkedin_jobs_*.csv processed_job_ids.json
          git commit -m "Auto: Update daily jobs $(date +'%Y-%m-%d')" || exit 0
          git push
